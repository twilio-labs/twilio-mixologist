name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-x64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install -g pnpm && pnpm install
      - name: Build the project
        run: pnpm build
        env:
          TWILIO_ACCOUNT_SID: ${{ vars.TWILIO_ACCOUNT_SID }}
          TWILIO_API_KEY: ${{ secrets.TWILIO_API_KEY }}
          TWILIO_API_SECRET: ${{ secrets.TWILIO_API_SECRET }}
          TWILIO_MESSAGING_SERVICE_SID: ${{ vars.TWILIO_MESSAGING_SERVICE_SID }}
          TWILIO_SYNC_SERVICE_SID: ${{ vars.TWILIO_SYNC_SERVICE_SID }}
          NEXT_PUBLIC_ATTENDEES_MAP: ${{ vars.NEXT_PUBLIC_ATTENDEES_MAP }}
      - name: Run script tests
        run: pnpm test
        env:
          TWILIO_ACCOUNT_SID: ${{ vars.TWILIO_ACCOUNT_SID }}
          TWILIO_API_KEY: ${{ secrets.TWILIO_API_KEY }}
          TWILIO_API_SECRET: ${{ secrets.TWILIO_API_SECRET }}
          TWILIO_MESSAGING_SERVICE_SID: ${{ vars.TWILIO_MESSAGING_SERVICE_SID }}
          TWILIO_SYNC_SERVICE_SID: ${{ vars.TWILIO_SYNC_SERVICE_SID }}
          TWILIO_VERIFY_SERVICE_SID: ${{ vars.TWILIO_VERIFY_SERVICE_SID }}
          NEXT_PUBLIC_ATTENDEES_MAP: ${{ vars.NEXT_PUBLIC_ATTENDEES_MAP }}
          MIXOLOGIST_LOGIN: ${{ vars.MIXOLOGIST_LOGIN }}
          ADMIN_LOGIN: ${{ vars.ADMIN_LOGIN }}

      - name: Prepare standalone build for tests
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Run Playwright tests
        # This runner only gets 1 worker by Playwright's CPU-based default,
        # which serializes all 150 test instances (30 tests x 5 browser
        # projects) and made the job run 25+ minutes instead of ~2. Force more
        # parallelism explicitly.
        run: pnpm exec playwright test --workers=4
        env:
          TWILIO_ACCOUNT_SID: ${{ vars.TWILIO_ACCOUNT_SID }}
          TWILIO_API_KEY: ${{ secrets.TWILIO_API_KEY }}
          TWILIO_API_SECRET: ${{ secrets.TWILIO_API_SECRET }}
          TWILIO_MESSAGING_SERVICE_SID: ${{ vars.TWILIO_MESSAGING_SERVICE_SID }}
          TWILIO_SYNC_SERVICE_SID: ${{ vars.TWILIO_SYNC_SERVICE_SID }}
          TWILIO_VERIFY_SERVICE_SID: ${{ vars.TWILIO_VERIFY_SERVICE_SID }}
          NEXT_PUBLIC_ATTENDEES_MAP: ${{ vars.NEXT_PUBLIC_ATTENDEES_MAP }}
          MIXOLOGIST_LOGIN: ${{ vars.MIXOLOGIST_LOGIN }}
          ADMIN_LOGIN: ${{ vars.ADMIN_LOGIN }}
          KIOSK_LOGIN: ${{ vars.KIOSK_LOGIN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
