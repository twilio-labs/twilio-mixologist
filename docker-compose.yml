services:
  twilio-mixologist:
    build:
      context: .
      args:
        TWILIO_API_KEY: ${TWILIO_API_KEY:-}
        TWILIO_API_SECRET: ${TWILIO_API_SECRET:-}
        TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
        TWILIO_SYNC_SERVICE_SID: ${TWILIO_SYNC_SERVICE_SID:-}
    image: ${IMAGE_NAME:-twilio-mixologist}
    container_name: ${CONTAINER_NAME:-twilio-mixologist}
    env_file:
      - ${ENV_FILE:-.env.local}
    ports:
      - "${HOST_PORT:-3000}:3000"
    restart: unless-stopped
